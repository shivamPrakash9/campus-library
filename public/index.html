<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Campus Library</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Campus Library</h1>
    <p>Authors and their books</p>

    <div id="list">Loading...</div>

    <form id="addForm">
        <h3>Add a book</h3>
        <input id="title" placeholder="Book title" required>
        <input id="year" type="number" placeholder="Year">
        <select id="authorId">
            <option value="1">Asha Patel</option>
            <option value="2">Ravi Kumar</option>
        </select>
        <button type="submit">Add book</button>
    </form>

    <script>
        const API = 'http://localhost:4000/';

        async function gql(query, variables) {
            const res = await fetch(API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query, variables })
            });

            const json = await res.json();
            if (json.errors) throw new Error(json.errors[0].message);
            return json.data;
        }

        async function load() {
            const data = await gql(`
        query {
          authors {
            name country
            books { title year }
          }
        }
      `);

            document.getElementById('list').innerHTML =
                data.authors.map(a => `
          <div class="author-card">
            <h2>${a.name}</h2>
            <p>${a.country || ''}</p>
            ${a.books.map(b => `
              <div class="book">
                ${b.title} (${b.year ?? 'Year unknown'})
              </div>
            `).join('')}
          </div>
        `).join('');
        }

        document.getElementById('addForm')
            .addEventListener('submit', async e => {
                e.preventDefault();

                try {
                    await gql(`
            mutation($t: String!, $y: Int, $a: ID!) {
              addBook(title: $t, year: $y, authorId: $a) {
                id
              }
            }
          `, {
                        t: document.getElementById('title').value,
                        y: document.getElementById('year').value
                            ? Number(document.getElementById('year').value)
                            : null,
                        a: document.getElementById('authorId').value
                    });

                    e.target.reset();
                    await load();
                } catch (error) {
                    alert(error.message);
                }
            });

        load().catch(error => {
            document.getElementById('list').textContent =
                'Could not load books: ' + error.message;
        });
    </script>
</body>

</html>
